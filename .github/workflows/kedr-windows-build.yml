name: Kedr Windows Product Build

on:
  workflow_call:
    inputs:
      product:
        description: 'studio or python'
        type: string
        required: true

permissions:
  contents: read

env:
  BAZEL_OUTPUT_ROOT: D:/bazelroot
  ANDROID_COMMIT: 935e4531a777fdbd2084c43fa575f27dbb22f728

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    env:
      PRODUCT: ${{ inputs.product }}
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate product
        run: |
          if ($env:PRODUCT -notin @('studio', 'python')) {
            throw "unsupported product: $env:PRODUCT"
          }

      - name: Report runner capacity
        run: |
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID, @{n = 'FreeGB'; e = { [math]::Round($_.FreeSpace / 1GB, 1) } },
              @{n = 'SizeGB'; e = { [math]::Round($_.Size / 1GB, 1) } } |
            Format-Table | Out-String | Write-Output
          "processors: $env:NUMBER_OF_PROCESSORS" | Write-Output

      - name: Checkout Android modules
        run: |
          git init android
          git -C android remote add origin https://github.com/JetBrains/android.git
          git -C android fetch --depth 1 origin $env:ANDROID_COMMIT
          git -C android checkout --detach FETCH_HEAD
          $actual = git -C android rev-parse HEAD
          if ($actual -ne $env:ANDROID_COMMIT) {
            throw "android checkout mismatch: $actual"
          }

      - name: Configure Bazel
        run: |
          $root = $env:BAZEL_OUTPUT_ROOT
          @(
            "startup --output_user_root=$root"
            "startup:windows --output_user_root=$root"
            "startup --host_jvm_args=-Djava.net.preferIPv4Stack=true"
            "startup:windows --host_jvm_args=-Djava.net.preferIPv4Stack=true"
            "startup --host_jvm_args=-Xmx4g"
            "common --disk_cache=$root/cache"
            "common --repository_cache=$root/repository"
            "common --experimental_disk_cache_gc_max_size=5G"
            "common --config=ci"
            "build --jobs=4"
            "build --worker_max_multiplex_instances=JvmCompile=2"
            "build --local_resources=memory=HOST_RAM*.65"
            "build --verbose_failures"
            "test --test_output=errors"
          ) | Set-Content -Encoding ascii -Path "$env:USERPROFILE\.bazelrc"

      - name: Cache Bazel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            D:/bazelroot/cache
            D:/bazelroot/repository
            D:/bazelroot/install
          key: kedr-bazel-${{ inputs.product }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel', '.bazelversion', '.bazeliskversion') }}
          restore-keys: |
            kedr-bazel-${{ inputs.product }}-
            kedr-bazel-

      - name: Test local reporting, Go and web support
        if: inputs.product == 'studio'
        run: |
          $platformTests = '//platform/platform-tests:tests_test'
          $tests = @(
            @{ Target = $platformTests; Filter = 'com.intellij.diagnostic.KedrErrorReportSubmitterTest'; Log = 'tests-reporting.log' },
            @{ Target = $platformTests; Filter = 'com.intellij.ide.plugins.advertiser.KedrCommercialSuggestionPolicyTest';
               Log = 'tests-suggestions.log' },
            @{ Target = '//plugins/textmate/tests:tests_test'; Filter = 'org.jetbrains.plugins.textmate.language.syntax.lexer.Go';
               Log = 'tests-go.log' },
            @{ Target = '//plugins/textmate/tests:tests_test'; Filter = 'org.jetbrains.plugins.textmate.language.syntax.lexer.Web';
               Log = 'tests-web.log' }
          )
          foreach ($test in $tests) {
            cmd /c "bazel.cmd test $($test.Target) --test_filter=$($test.Filter) --keep_going > $($test.Log) 2>&1"
            if ($LASTEXITCODE -ne 0) {
              $tail = Get-Content $test.Log -Tail 180
              $tail
              "## Test failure: $($test.Filter)`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
              $tail | Add-Content $env:GITHUB_STEP_SUMMARY
              '```' | Add-Content $env:GITHUB_STEP_SUMMARY
              throw "test failed: $($test.Filter)"
            }
          }

      - name: Build
        run: |
          $entry = if ($env:PRODUCT -eq 'python') { 'python\installers.cmd' } else { 'installers.cmd' }
          $log = "build-$env:PRODUCT.log"
          $buildArgs = '-Dintellij.build.target.os=current -Dintellij.build.target.arch=x64'
          cmd /c "$entry $buildArgs > $log 2>&1"
          if ($LASTEXITCODE -ne 0) {
            $tail = Get-Content $log -Tail 200
            $tail
            "## Build failure: $env:PRODUCT`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            $tail | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            throw "build failed with exit code $LASTEXITCODE"
          }

      - name: Verify artifacts
        run: |
          $dir = "out/kedr-$env:PRODUCT/artifacts"
          $stage = "out/kedr-$env:PRODUCT/release"
          node tools/kedr/verify-release.mjs --product $env:PRODUCT --artifacts-dir $dir --stage-dir $stage |
            Tee-Object -FilePath "verify-$env:PRODUCT.json"
          if ($LASTEXITCODE -ne 0) {
            throw "artifact verification failed with exit code $LASTEXITCODE"
          }

      - name: Smoke test
        run: |
          $dir = "out/kedr-$env:PRODUCT/artifacts"
          ./tools/kedr/smoke-release.ps1 -Product $env:PRODUCT -ArtifactsDir $dir -WorkDir "D:/kedr-smoke-$env:PRODUCT"

      - name: Publish artifact summary
        if: always()
        run: |
          $stage = "out/kedr-$env:PRODUCT/release"
          "## Kedr $env:PRODUCT artifacts" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path $stage) {
            '| File | Bytes |' | Add-Content $env:GITHUB_STEP_SUMMARY
            '| --- | --- |' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-ChildItem $stage -File | ForEach-Object {
              "| $($_.Name) | $($_.Length) |" | Add-Content $env:GITHUB_STEP_SUMMARY
            }
          } else {
            'No staged artifacts.' | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: log-${{ inputs.product }}
          path: |
            build-${{ inputs.product }}.log
            verify-${{ inputs.product }}.json
            smoke-${{ inputs.product }}-*.log
            tests-*.log
          retention-days: 7

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kedr-${{ inputs.product }}-win-x64
          path: out/kedr-${{ inputs.product }}/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
